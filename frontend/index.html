<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoDoggity Fitness Planner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #F9F9F9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #000;
        }

        /* ── Header ── */
        .site-header {
            background: #000;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .site-header img {
            height: 42px;
            width: auto;
        }

        .site-header h1 {
            color: #fff;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        /* ── Main layout ── */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 16px 60px;
        }

        .wrapper {
            width: 100%;
            max-width: 860px;
        }

        /* ── Card ── */
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
            padding: 36px 40px;
            margin-bottom: 32px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #E21E51;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }

        /* ── Form ── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #000;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: #000;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #E21E51;
            box-shadow: 0 0 0 3px rgba(226, 30, 81, 0.1);
        }

        input[type="text"]::placeholder {
            color: #aaa;
            font-size: 0.875rem;
        }

        .hint {
            font-size: 0.78rem;
            color: #888;
            font-style: italic;
        }

        /* ── Submit button ── */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #E21E51;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, transform 0.15s;
        }

        .submit-btn:hover {
            background: #c4174a;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Loader ── */
        .loader {
            display: none;
            text-align: center;
            padding: 32px 0 16px;
        }

        .loader-spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #E21E51;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 12px;
        }

        .loader p {
            color: #E21E51;
            font-size: 0.9rem;
            font-weight: 500;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ── Error banner ── */
        .error-banner {
            display: none;
            background: #fff0f3;
            border: 1.5px solid #E21E51;
            border-radius: 8px;
            padding: 16px 20px;
            margin-top: 16px;
        }

        .error-banner p {
            color: #c4174a;
            font-size: 0.9rem;
        }

        .error-banner strong {
            display: block;
            margin-bottom: 6px;
            font-size: 1rem;
        }

        /* ── Result section ── */
        #result-section {
            display: none;
        }

        .result-meta {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-meta span {
            font-size: 0.9rem;
            color: #444;
        }

        .result-meta strong {
            color: #000;
        }

        /* ── Plane coverage ── */
        .plane-coverage {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .plane-badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .plane-badge.covered {
            background: #E21E51;
            color: #fff;
        }

        .plane-badge.missing {
            background: #f0f0f0;
            color: #999;
            text-decoration: line-through;
        }

        /* ── Day cards ── */
        .week-grid {
            display: grid;
            gap: 16px;
        }

        .day-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .day-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .day-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #000;
        }

        .day-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #fff;
        }

        .badge-training      { background: #E21E51; }
        .badge-light_training { background: #e87a9a; }
        .badge-rest          { background: #888; }
        .badge-sport_only    { background: #000; }

        .day-meta {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 10px;
        }

        .day-meta strong {
            color: #000;
        }

        .day-note {
            font-size: 0.875rem;
            color: #666;
            font-style: italic;
        }

        /* Warmup / cooldown rows */
        .session-row {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 8px;
        }

        .session-row strong {
            color: #000;
            min-width: 80px;
            flex-shrink: 0;
        }

        /* ── Exercises ── */
        .exercises-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #E21E51;
            margin: 14px 0 8px;
        }

        .exercise-item {
            background: #F9F9F9;
            border-left: 3px solid #E21E51;
            border-radius: 0 6px 6px 0;
            padding: 10px 14px;
            margin-bottom: 8px;
            font-size: 0.875rem;
        }

        .exercise-item strong {
            color: #000;
            display: block;
            margin-bottom: 4px;
        }

        .exercise-item small {
            color: #666;
            display: block;
            line-height: 1.5;
        }

        .exercise-item a {
            color: #E21E51;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .exercise-item a:hover {
            text-decoration: underline;
        }

        .complexity-tag {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 6px;
            vertical-align: middle;
        }

        .complexity-tag.advanced,
        .complexity-tag.hard {
            background: #fff0f3;
            color: #E21E51;
            border: 1px solid #E21E51;
        }

        .complexity-tag.beginner {
            background: #f0fff4;
            color: #28a745;
            border: 1px solid #28a745;
        }

        .complexity-tag.intermediate {
            background: #fff8e1;
            color: #f59e0b;
            border: 1px solid #f59e0b;
        }

        .new-exercises-note {
            font-size: 0.78rem;
            color: #888;
            margin-top: 10px;
            font-style: italic;
        }

        /* ── Footer ── */
        footer {
            background: #000;
            color: #fff;
            text-align: center;
            padding: 18px;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .card {
                padding: 24px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: 1;
            }

            .site-header h1 {
                font-size: 1.05rem;
            }

            .result-meta {
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <img src="https://www.godoggity.com/wp-content/uploads/2023/07/cropped-FaviconPink.png" alt="GoDoggity logo">
        <h1>GoDoggity Fitness Planner</h1>
    </header>

    <main>
        <div class="wrapper">

            <!-- Form card -->
            <div class="card">
                <p class="card-title">Generate a personalised week plan</p>

                <form id="plannerForm">
                    <div class="form-grid">

                        <div class="form-group">
                            <label for="dog_name">Dog name</label>
                            <input type="text" id="dog_name" name="dog_name" required placeholder="e.g. Max">
                        </div>

                        <div class="form-group">
                            <label for="age_group">Age group</label>
                            <select id="age_group" name="age_group" required>
                                <option value="">Select…</option>
                                <option value="puppy">Puppy</option>
                                <option value="adult">Adult</option>
                                <option value="senior">Senior</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fitness_level">Fitness level</label>
                            <select id="fitness_level" name="fitness_level" required>
                                <option value="">Select…</option>
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="equipment">Available equipment</label>
                            <select id="equipment" name="equipment" required>
                                <option value="">Select…</option>
                                <option value="none">None</option>
                                <option value="basic">Basic</option>
                                <option value="full">Full</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label for="limitations">Limitations</label>
                            <input type="text" id="limitations" name="limitations" placeholder="e.g. knee, back, no jumping">
                            <span class="hint">Comma-separated (optional)</span>
                        </div>

                        <div class="form-group full-width">
                            <label for="activities">Activities this week</label>
                            <input type="text" id="activities" name="activities" placeholder="e.g. Mon:agility, Wed:training">
                            <span class="hint">Format: day:activity (optional)</span>
                        </div>

                    </div>

                    <button type="submit" class="submit-btn">Generate week plan</button>
                </form>

                <!-- Loader -->
                <div class="loader" id="loader">
                    <div class="loader-spinner"></div>
                    <p>Generating plan…</p>
                </div>

                <!-- Error -->
                <div class="error-banner" id="errorBanner">
                    <strong>Something went wrong</strong>
                    <p id="errorMsg"></p>
                </div>
            </div>

            <!-- Result section -->
            <div id="result-section">
                <div class="card">
                    <p class="card-title">Week plan</p>

                    <div class="result-meta">
                        <span><strong>Dog:</strong> <span id="resDogName"></span></span>
                        <span><strong>Fitness level:</strong> <span id="resFitness"></span></span>
                    </div>

                    <!-- Movement plane coverage (RULE-E) -->
                    <div id="planeCoverageRow" style="margin-bottom: 20px; display: none;">
                        <p style="font-size: 0.8rem; font-weight: 600; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Movement plane coverage</p>
                        <div class="plane-coverage" id="planeCoverage"></div>
                    </div>

                    <div class="week-grid" id="weekGrid"></div>
                </div>
            </div>

        </div>
    </main>

    <footer>Powered by GoDoggity</footer>

    <script>
        const BADGE_CLASS = {
            training:       'badge-training',
            light_training: 'badge-light_training',
            rest:           'badge-rest',
            sport_only:     'badge-sport_only',
        };

        const BADGE_LABEL = {
            training:       'Training',
            light_training: 'Light',
            rest:           'Rest',
            sport_only:     'Sport',
        };

        const PLANE_LABEL = {
            median:       'Median (sagittal)',
            dorsal:       'Dorsal (frontal)',
            transversal:  'Transversal',
        };

        function difficultyTag(level) {
            if (!level) return '';
            const cls = ['advanced','hard','beginner','intermediate'].includes(level.toLowerCase())
                ? level.toLowerCase() : '';
            return cls ? `<span class="complexity-tag ${cls}">${level}</span>` : '';
        }

        function renderPlan(data) {
            // Meta
            document.getElementById('resDogName').textContent = data.dog_name || '—';
            document.getElementById('resFitness').textContent = data.fitness_level || '—';

            // Plane coverage
            const coverage = data.plane_coverage;
            const coverageRow = document.getElementById('planeCoverageRow');
            const coverageEl = document.getElementById('planeCoverage');
            if (coverage && typeof coverage === 'object') {
                coverageEl.innerHTML = Object.entries(coverage).map(([key, val]) => {
                    const cls = val ? 'covered' : 'missing';
                    const label = PLANE_LABEL[key] || key;
                    return `<span class="plane-badge ${cls}">${label}</span>`;
                }).join('');
                coverageRow.style.display = '';
            } else {
                coverageRow.style.display = 'none';
            }

            // Week plan
            const plan = data.week_plan || data.plan || [];
            const grid = document.getElementById('weekGrid');
            grid.innerHTML = plan.map(day => {
                const badgeCls   = BADGE_CLASS[day.type]  || 'badge-rest';
                const badgeLabel = BADGE_LABEL[day.type]  || day.type;

                const exercisesHtml = (day.exercises && day.exercises.length > 0)
                    ? `<p class="exercises-label">Exercises</p>
                       ${day.exercises.map(ex => `
                           <div class="exercise-item">
                               <strong>${ex.name_en || 'Exercise'}${difficultyTag(ex.difficulty)}</strong>
                               ${ex.focus ? `<small>Focus: ${ex.focus}</small>` : ''}
                               ${ex.video_url ? `<a href="${ex.video_url}" target="_blank">&#9654; Watch video</a>` : ''}
                           </div>
                       `).join('')}
                       ${day.new_exercises_count !== undefined
                           ? `<p class="new-exercises-note">Advanced/hard exercises in this session: ${day.new_exercises_count}</p>`
                           : ''}`
                    : '';

                return `
                    <div class="day-card">
                        <div class="day-card-header">
                            <span class="day-name">${day.day}</span>
                            <span class="day-badge ${badgeCls}">${badgeLabel}</span>
                        </div>
                        ${day.note ? `<p class="day-note">${day.note}</p>` : ''}
                        ${day.focus ? `<div class="day-meta"><strong>Focus:</strong> ${day.focus}</div>` : ''}
                        ${day.warmup ? `
                            <div class="session-row">
                                <strong>Warm-up</strong>
                                <span>${day.warmup}</span>
                            </div>` : ''}
                        ${exercisesHtml}
                        ${day.cooldown ? `
                            <div class="session-row" style="margin-top: 12px;">
                                <strong>Cool-down</strong>
                                <span>${day.cooldown}</span>
                            </div>` : ''}
                    </div>
                `;
            }).join('');

            document.getElementById('result-section').style.display = '';
        }

        document.getElementById('plannerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form       = e.target;
            const submitBtn  = form.querySelector('.submit-btn');
            const loader     = document.getElementById('loader');
            const errorEl    = document.getElementById('errorBanner');
            const errorMsg   = document.getElementById('errorMsg');

            submitBtn.disabled = true;
            loader.style.display = 'block';
            errorEl.style.display = 'none';
            document.getElementById('result-section').style.display = 'none';

            const payload = {
                dog_name:      form.dog_name.value,
                age_group:     form.age_group.value,
                fitness_level: form.fitness_level.value,
                limitations:   form.limitations.value,
                activities:    form.activities.value,
                equipment:     form.equipment.value,
            };

            try {
                const response = await fetch('https://godoggity-fitness-planner-core-api.onrender.com/generate-plan', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify(payload),
                });

                const data = await response.json();

                if (response.ok) {
                    renderPlan(data);
                } else {
                    errorMsg.textContent = data.detail || 'An error occurred while generating the plan.';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = `Could not connect to the API. Please check whether the Render service is online. (${err.message})`;
                errorEl.style.display = 'block';
            } finally {
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
