<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoDoggity Fitness Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="text"]:hover,
        select:hover {
            border-color: #999;
        }

        .hint {
            font-size: 0.85em;
            color: #888;
            margin-top: 5px;
            font-style: italic;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }

        #result.success {
            background: #d4edda;
            border-left-color: #28a745;
        }

        #result.error {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loader-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .plan-container {
            margin-top: 15px;
        }

        .day-card {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .day-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .exercise-item {
            background: #f8f9fa;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐕 GoDoggity Fitness Planner</h1>
            <p>Maak een gepersonaliseerd weekplan voor jouw hond</p>
        </div>

        <form id="plannerForm">
            <div class="form-group">
                <label for="dog_name">Hond naam</label>
                <input type="text" id="dog_name" name="dog_name" required placeholder="Bijv. Max">
            </div>

            <div class="form-group">
                <label for="age_group">Leeftijd groep</label>
                <select id="age_group" name="age_group" required>
                    <option value="">Selecteer...</option>
                    <option value="puppy">Puppy</option>
                    <option value="adult">Adult</option>
                    <option value="senior">Senior</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fitness_level">Fitness level</label>
                <select id="fitness_level" name="fitness_level" required>
                    <option value="">Selecteer...</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div class="form-group">
                <label for="limitations">Beperkingen</label>
                <input type="text" id="limitations" name="limitations" placeholder="Bijv. knie, rug, geen springen">
                <div class="hint">Komma gescheiden (optioneel)</div>
            </div>

            <div class="form-group">
                <label for="activities">Activiteiten deze week</label>
                <input type="text" id="activities" name="activities" placeholder="Bijv. Mon:agility, Wed:training">
                <div class="hint">Formaat: dag:activiteit (optioneel)</div>
            </div>

            <div class="form-group">
                <label for="equipment">Beschikbaar materiaal</label>
                <select id="equipment" name="equipment" required>
                    <option value="">Selecteer...</option>
                    <option value="none">None</option>
                    <option value="basic">Basic</option>
                    <option value="full">Full</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Genereer Weekplan</button>
        </form>

        <div class="loader" id="loader">
            <div class="loader-spinner"></div>
            <p style="margin-top: 10px; color: #667eea;">Plan wordt gegenereerd...</p>
        </div>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById('plannerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const submitBtn = form.querySelector('.submit-btn');
            const loader = document.getElementById('loader');
            const resultDiv = document.getElementById('result');

            // Disable form
            submitBtn.disabled = true;
            loader.style.display = 'block';
            resultDiv.style.display = 'none';
            resultDiv.className = '';

            // Collect form data
            const formData = {
                dog_name: form.dog_name.value,
                age_group: form.age_group.value,
                fitness_level: form.fitness_level.value,
                limitations: form.limitations.value,
                activities: form.activities.value,
                equipment: form.equipment.value
            };

            try {
                const response = await fetch('http://localhost:8000/generate-plan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h3 style="color: #28a745; margin-bottom: 15px;">✓ Weekplan gegenereerd!</h3>
                        <p><strong>Hond:</strong> ${data.dog_name}</p>
                        <p><strong>Fitness level:</strong> ${data.fitness_level}</p>
                        <div class="plan-container">
                            <h4 style="margin: 15px 0 10px 0; color: #333;">Week planning:</h4>
                            ${data.week_plan.map(day => `
                                <div class="day-card">
                                    <h3>${day.day} - ${day.type}</h3>
                                    ${day.note ? `<p><em>${day.note}</em></p>` : ''}
                                    ${day.focus ? `<p><strong>Focus:</strong> ${day.focus}</p>` : ''}
                                    ${day.warmup ? `<p><strong>Warmup:</strong> ${day.warmup}</p>` : ''}
                                    ${day.exercises && day.exercises.length > 0 ? `
                                        <div style="margin-top: 10px;">
                                            <strong>Oefeningen:</strong>
                                            ${day.exercises.map(ex => `
                                                <div class="exercise-item">
                                                    <strong>${ex.name_en || 'Exercise'}</strong>
                                                    ${ex.focus ? `<br><small>Focus: ${ex.focus}</small>` : ''}
                                                    ${ex.difficulty ? `<br><small>Difficulty: ${ex.difficulty}</small>` : ''}
                                                    ${ex.video_url ? `<br><a href="${ex.video_url}" target="_blank" style="color: #667eea; text-decoration: none;">▶ Video</a>` : ''}
                                                </div>
                                            `).join('')}
                                        </div>
                                    ` : ''}
                                    ${day.cooldown ? `<p style="margin-top: 10px;"><strong>Cooldown:</strong> ${day.cooldown}</p>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `
                        <h3 style="color: #dc3545; margin-bottom: 10px;">✗ Fout opgetreden</h3>
                        <p>${data.detail || 'Er is een fout opgetreden bij het genereren van het plan.'}</p>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h3 style="color: #dc3545; margin-bottom: 10px;">✗ Verbindingsfout</h3>
                    <p>Kan geen verbinding maken met de API. Controleer of de server draait op http://localhost:8000</p>
                    <p style="margin-top: 10px; font-size: 0.9em; color: #666;">Error: ${error.message}</p>
                `;
            } finally {
                loader.style.display = 'none';
                resultDiv.style.display = 'block';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
